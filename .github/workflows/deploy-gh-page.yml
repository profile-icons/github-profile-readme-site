name: deploy-gh-page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            .models
            .cache/huggingface
          key: hf-nllb-200-distilled-600m-q8-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Install
        run: npm ci

      - name: Check
        run: npm run quality

      - name: i18n
        run: npm run i18n
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Build
        run: npm exec -- astro build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
